<!DOCTYPE html>
<html>
<head>
    <title>Satellite Image Classification</title>
    <style>
        body { font-family: Arial; background: #f2f2f2; text-align: center; }
        .box { background: white; padding: 30px; margin: 50px auto; width: 400px; border-radius: 10px; }
        button { padding: 10px 20px; background: #0078d4; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Satellite Image Classification</h2>
        <form action="/predict" method="post" enctype="multipart/form-data">
            <input type="file" name="image" required><br><br>
            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
        <h3>Result:</h3>
        <p><b>{{ prediction }}</b></p>
        <p>Confidence: {{ confidence }}</p>
        {% endif %}
    </div>
</body>
</html>
